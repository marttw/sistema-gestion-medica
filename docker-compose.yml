# Local development database. Credentials are read from .env (never committed).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Sort and compare text with ICU in Spanish (Álvarez before Díaz, ñ after n).
      # Alpine's C library (musl) cannot do locale-aware sorting on its own.
      # Only applied when the data volume is created for the first time.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-AR"
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
